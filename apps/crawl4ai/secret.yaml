---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawl4ai-secret
  namespace: crawl4ai
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: crawl4ai
  namespace: crawl4ai
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: crawl4ai
    serviceAccount: crawl4ai-secret
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: crawl4ai-secret
  namespace: crawl4ai
spec:
  type: kv-v2

  mount: secret
  path: crawl4ai

  destination:
    create: true
    name: crawl4ai-secret
    type: Opaque
    transformation:
      excludeRaw: true

  vaultAuthRef: crawl4ai
