---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: immich
spec:
  interval: 24h
  type: "oci"
  url: oci://registry-1.docker.io/bitnamicharts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      version: 22.0.5
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    global:
      defaultStorageClass: mayastor-single-hdd
    architecture: standalone
