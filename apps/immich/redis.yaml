---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: immich
spec:
  interval: 24h
  type: "oci"
  url: oci://registry-1.docker.io/bitnamicharts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      version: 24.1.3
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    global:
      defaultStorageClass: mayastor-single-hdd
    architecture: standalone
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: immich
spec:
  interval: 24h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: 0.9.3
      sourceRef:
        kind: HelmRepository
        name: valkey
  values:
    dataStorage:
      enabled: true
      persistentVolumeClaimName: immich-valkey

    auth:
      enabled: true
      usersExistingSecret: redis
      aclUsers:
        default:
          passwordKey: redis-password
          permissions: "~* &* +@all"
