---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: immich
spec:
  interval: 24h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: valkey
  values:
    dataStorage:
      enabled: true
      persistentVolumeClaimName: immich-valkey

    auth:
      enabled: true
      usersExistingSecret: redis
      aclUsers:
        default:
          passwordKey: redis-password
          permissions: "~* &* +@all"
