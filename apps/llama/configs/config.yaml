        -hf unsloth/Qwen3.5-0.8B-GGUF:Q4_K_XL
        ${qwen35_ctx_256k}
        ${qwen35_sampling}
        ${base_args}
        ${thinking_on}

  "Qwen3.5-0.8B-GGUF-nothink:Q4_K_XL":
