---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisord
  namespace: llama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      terminationGracePeriodSeconds: 60
      # boot.sh pivot_roots away from the container root, so a mounted
      # service account token would be left behind; nothing here needs it.
      automountServiceAccountToken: false
      containers:
        - name: supervisord
          image: gitea.lumpiasty.xyz/lumpiasty/supervisord:latest@sha256:3b4f2c5bbedaf18a213d63d437bf92faf7de68e1e032c15d20e355d021bad5b8
          imagePullPolicy: IfNotPresent
          # systemd (booted by /boot.sh) writes status and service output to
          # /dev/console, which only exists with a tty; it feeds kubectl logs.
          tty: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: WORKSPACE
              value: /root
          volumeMounts:
            - name: models
              mountPath: /root
            # persistent rootfs; /boot.sh seeds /rootfs/os and pivots into it
            - name: rootfs
              mountPath: /rootfs
          resources:
            limits:
              # /dev/dri/renderD128 via generic-device-plugin (Vulkan only)
              squat.ai/gpu: 1
          # Not privileged: no host /dev, read-only /sys and /proc/sys.
          # SYS_ADMIN is what /boot.sh (mount, pivot_root, cgroup remount) and
          # systemd (unit sandboxing) need.
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_ADMIN
            # systemd uses syscalls (keyctl, ...) the default profile blocks
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-lvmssd
        - name: rootfs
          persistentVolumeClaim:
            claimName: llama-rootfs-lvmssd
---
apiVersion: v1
kind: Service
metadata:
  name: llama
  namespace: llama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 8080
      protocol: TCP
  selector:
    app: llama-swap
---
apiVersion: v1
kind: Service
metadata:
  name: llama-sshd
  namespace: llama
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  ports:
    - name: sshd
      port: 22
      targetPort: 22
      protocol: TCP
  selector:
    app: llama-swap
