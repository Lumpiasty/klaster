---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisord
  namespace: llama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        # Seeds the rootfs PVC (subdir "os") from the image on first boot
        - name: rootfs-seed
          image: gitea.lumpiasty.xyz/lumpiasty/supervisord:latest@sha256:07fa24ffc22c143da3ecfea120b3e7e0a360fe50d8ca1f02102c79263f569287
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: models
              mountPath: /root
            - name: rootfs
              mountPath: /rootfs
          securityContext:
            privileged: true
      containers:
        - name: supervisord
          image: gitea.lumpiasty.xyz/lumpiasty/supervisord:latest@sha256:07fa24ffc22c143da3ecfea120b3e7e0a360fe50d8ca1f02102c79263f569287
          imagePullPolicy: IfNotPresent
          # Image entrypoint is /boot.sh (the seeder); run supervisord directly
          # from the persistent rootfs instead.
          command: ["/entrypoint.sh"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: WORKSPACE
              value: /root
          volumeMounts:
            - name: rootfs
              mountPath: /
              subPath: os
            - name: models
              mountPath: /root
            - mountPath: /dev/kfd
              name: kfd
            - mountPath: /dev/dri
              name: dri
          securityContext:
            privileged: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-lvmssd
        - name: rootfs
          persistentVolumeClaim:
            claimName: llama-rootfs-lvmssd
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llama
  namespace: llama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 8080
      protocol: TCP
  selector:
    app: llama-swap
