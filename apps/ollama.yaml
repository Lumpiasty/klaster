---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama-helm
  namespace: ollama
spec:
  interval: 24h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 30m
  chart:
    spec:
      chart: ollama
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: ollama-helm
        namespace: ollama
      interval: 12h
  values:
    ollama:
      gpu:
        enabled: false
    persistentVolume:
      enabled: true
      storageClass: mayastor-single-hdd
      size: 200Gi
