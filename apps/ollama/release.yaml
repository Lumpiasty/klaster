---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama-helm
  namespace: ollama
spec:
  interval: 24h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 30m
  chart:
    spec:
      chart: ollama
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: ollama-helm
        namespace: ollama
      interval: 12h
  values:
    ollama:
      gpu:
        enabled: false
    persistentVolume:
      enabled: true
      storageClass: mayastor-single-hdd
      size: 200Gi
    # GPU support
    # Rewrite of options in
    # https://hub.docker.com/r/grinco/ollama-amd-apu
    image:
      repository: grinco/ollama-amd-apu
      tag: vulkan
    securityContext:
      # Not ideal
      privileged: true
      capabilities:
        add:
          - PERFMON
    volumeMounts:
      - name: kfd
        mountPath: /dev/kfd
      - name: dri
        mountPath: /dev/dri
    volumes:
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
