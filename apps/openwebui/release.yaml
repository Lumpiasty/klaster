---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 24h
  url: https://open-webui.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      version: 12.5.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
  values:
    ingress:
      enabled: true
      class: nginx-ingress
      host: openwebui.lumpiasty.xyz
      tls: true
      existingSecret: openwebui-ingress
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-buffering: "false"
        nginx.ingress.kubernetes.io/proxy-read-timeout: 30m

    persistence:
      enabled: true
      existingClaim: openwebui-lvmhdd

    enableOpenaiApi: true
    openaiBaseApiUrl: "http://llama.llama.svc.cluster.local:11434/v1"

    ollama:
      enabled: false

    pipelines:
      enabled: true
      persistence:
        enabled: true
        existingClaim: openwebui-pipelines-lvmhdd
