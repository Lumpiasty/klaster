---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 24h
  url: https://open-webui.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      version: 16.5.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
  values:
    # Disable built in ingress, service is broken in chart
    # They have hard coded wrong target port
    # Reimplementing that in ingress.yaml
    ingress:
      enabled: false

    persistence:
      enabled: true
      existingClaim: openwebui-lvmhdd

    enableOpenaiApi: true
    openaiBaseApiUrl: "http://llama.llama.svc.cluster.local:11434/v1"

    ollama:
      enabled: false

    pipelines:
      enabled: true
      persistence:
        enabled: true
        existingClaim: openwebui-pipelines-lvmhdd

    terminals:
      enabled: true

    # SSO with Authentik
    extraEnvVars:
      - name: WEBUI_URL
        value: "https://openwebui.lumpiasty.xyz"
      - name: OAUTH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: openwebui-authentik
            key: client_id
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: openwebui-authentik
            key: client_secret
      - name: OAUTH_PROVIDER_NAME
        value: "authentik"
      - name: OPENID_PROVIDER_URL
        value: "https://authentik.lumpiasty.xyz/application/o/open-web-ui/.well-known/openid-configuration"
      - name: OPENID_REDIRECT_URI
        value: "https://openwebui.lumpiasty.xyz/oauth/oidc/callback"
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ROLES_CLAIM
        value: "groups"
      - name: OAUTH_ADMIN_ROLES
        value: "Admins"
      - name: OAUTH_ALLOWED_ROLES
        value: "Users"
      - name: OAUTH_AUTO_REDIRECT
        value: "true"
      # STT via parakeet-server (routed through llama-swap)
      - name: AUDIO_STT_ENGINE
        value: "openai"
      - name: AUDIO_STT_OPENAI_API_BASE_URL
        value: "http://llama.llama.svc.cluster.local:11434/v1"
      - name: AUDIO_STT_OPENAI_API_KEY
        value: "ignored"
      - name: AUDIO_STT_MODEL
        value: "parakeet-tdt_ctc-1.1b"
      # TTS via OuteTTS (routed through llama-swap)
      # TTS via dedicated Kokoro server (CPU-only, separate pod)
      - name: AUDIO_TTS_ENGINE
        value: "openai"
      - name: AUDIO_TTS_OPENAI_API_BASE_URL
        value: "http://kokoro.llama.svc.cluster.local:8880/v1"
      - name: AUDIO_TTS_OPENAI_API_KEY
        value: "ignored"
      - name: AUDIO_TTS_MODEL
        value: "kokoro"
      - name: AUDIO_TTS_VOICE
        value: "af_heart"
      # Image generation via llama-swap sd-server
      - name: ENABLE_IMAGE_GENERATION
        value: "true"
      - name: IMAGE_GENERATION_ENGINE
        value: "openai"
      - name: IMAGES_OPENAI_API_BASE_URL
        value: "http://llama.llama.svc.cluster.local:11434/v1"
      - name: IMAGES_OPENAI_API_KEY
        value: "ignored"
      - name: IMAGE_GENERATION_MODEL
        value: "flux2-klein-4b:Q4_K_M"
      - name: IMAGE_SIZE
        value: "512x512"
      # Image editing via llama-swap sd-server (/v1/images/edits)
      - name: ENABLE_IMAGE_EDIT
        value: "true"
      - name: IMAGE_EDIT_ENGINE
        value: "openai"
      - name: IMAGES_EDIT_OPENAI_API_BASE_URL
        value: "http://llama.llama.svc.cluster.local:11434/v1"
      - name: IMAGES_EDIT_OPENAI_API_KEY
        value: "ignored"
      - name: IMAGE_EDIT_MODEL
        value: "flux2-klein-4b:Q4_K_M"
      - name: IMAGE_EDIT_SIZE
        value: "512x512"
