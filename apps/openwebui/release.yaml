---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 24h
  url: https://open-webui.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      version: 12.10.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
  values:
    # Disable built in ingress, service is broken in chart
    # They have hard coded wrong target port
    # Reimplementing that in ingress.yaml
    ingress:
      enabled: false

    persistence:
      enabled: true
      existingClaim: openwebui-lvmhdd

    enableOpenaiApi: true
    openaiBaseApiUrl: "http://llama.llama.svc.cluster.local:11434/v1"

    ollama:
      enabled: false

    pipelines:
      enabled: true
      persistence:
        enabled: true
        existingClaim: openwebui-pipelines-lvmhdd
