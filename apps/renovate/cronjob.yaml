---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@daily"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              # Update this to the latest available and then enable Renovate on
              # the manifest
              image: renovate/renovate:42.84.1-full
              envFrom:
                - secretRef:
                    name: renovate-gitea-token
                - configMapRef:
                    name: renovate-config
          restartPolicy: Never
