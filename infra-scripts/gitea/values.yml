postgresql-ha:
  enabled: false

postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      storageClass: mayastor-single-hdd
    resources:
      requests:
        cpu: 0

redis-cluster:
  enabled: false

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      storageClass: mayastor-single-hdd
    resources:
      requests:
        cpu: 0

persistence:
  enabled: true
  storageClass: mayastor-single-hdd

gitea:
  config:
    database:
      DB_TYPE: postgres
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
  admin:
    username: GiteaAdmin
    email: gi@tea.com
    passwordMode: initialOnlyRequireReset

service:
  ssh:
    annotations:
      lbipam.cilium.io/sharing-key: gitea
      lbipam.cilium.io/sharing-cross-namespace: nginx-ingress-controller
      lbipam.cilium.io/ips: 10.44.0.0,2001:470:61a3:400::1
    type: LoadBalancer
    port: 22
    # Requirement for sharing ip with other service
    externalTrafficPolicy: Cluster
    ipFamilyPolicy: RequireDualStack

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    acme.cert-manager.io/http01-edit-in-place: "true"
  hosts:
    - host: gitea.lumpiasty.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - gitea.lumpiasty.xyz
      secretName: gitea-ingress

resources:
  requests:
    cpu: 0

initContainers:
  resources:
    requests:
      cpu: 0
