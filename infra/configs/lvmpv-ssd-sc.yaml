---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssd-lvmpv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
parameters:
  storage: "lvm"
  volgroup: "openebs-ssd"
  fsType: "btrfs"
  shared: "yes"
provisioner: local.csi.openebs.io
allowVolumeExpansion: true
volumeBindingMode: Immediate
