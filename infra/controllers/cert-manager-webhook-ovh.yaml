---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  interval: 24h
  url: https://aureq.github.io/cert-manager-webhook-ovh/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: cert-manager
      interval: 12h
  values:
    groupName: lumpiasty-homelab
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
    issuers:
      - name: letsencrypt
        create: true
        kind: ClusterIssuer
        cnameStrategy: None
        acmeServerUrl: https://acme-v02.api.letsencrypt.org/directory
        email: arek.dzski@gmail.com
        ovhEndpointName: ovh-eu
        ovhAuthenticationMethod: application
        ovhAuthenticationRef:
          applicationKeyRef:
            name: ovh-credentials
            key: applicationKey
          applicationSecretRef:
            name: ovh-credentials
            key: applicationSecret
          applicationConsumerKeyRef:
            name: ovh-credentials
            key: consumerKey
        # Workaround for chart's bug
        # nil pointer evaluating interface {}.enabled
        externalAccountBinding:
          enabled: false
          keyID: ""
          keySecretRef: 
            name: ""
            key: ""
