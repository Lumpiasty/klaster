---
# Exposes host device nodes to pods as extended resources, so a pod can get
# one device (with the matching device-cgroup rule) without being privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: generic-device-plugin
  labels:
    # the plugin itself needs the host's /dev and the kubelet socket
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: generic-device-plugin
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest@sha256:6fd8023741b24c0302a97153605ff77f4d55535a4b5a8b0c8502b208e8310525
          args:
            - --domain
            - squat.ai
            # squat.ai/gpu: the DRM render node only. Enough for Vulkan
            # (Mesa RADV); no /dev/kfd (no ROCm on this GPU) and no card*
            # (no display/KMS).
            - --device
            - |
              name: gpu
              groups:
                - paths:
                    - path: /dev/dri/renderD*
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
