---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  interval: 24h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: 8.3.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
      interval: 12h
  values:
    # Loosely recreating options from tutorial of openebs
    # https://openebs.io/docs/Solutioning/backup-and-restore/velerobrfs
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.11.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    deployNodeAgent: true

    configuration:
      features: EnableCSI
      backupStorageLocation:
        - name: backblaze
          provider: aws
          bucket: lumpiasty-backups
          prefix: homelab-backups
          default: true
          validationFrequency: 1h
          credential:
            name: backblaze-key
            key: key
          config:
            region: eu-central-003
            s3Url: https://s3.eu-central-003.backblazeb2.com
            checksumAlgorithm: ""
      volumeSnapshotLocation:
        - name: mayastor
          provider: csi

    resources:
      requests:
        cpu: 0
    nodeAgent:
      resources:
        requests:
          cpu: 0
